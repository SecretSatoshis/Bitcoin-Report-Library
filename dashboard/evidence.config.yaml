# Dark-only. The page's chart colors, colorscale midpoints and the model-values strip
# are all tuned for a near-black background, so a light rendering is not something this
# dashboard supports — the switcher is off and each color has a single (dark) value.
appearance:
  default: dark
  switcher: false

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/csv": {}

theme:
  colors:
    # Brand
    primary: "#F7931A"           # Bitcoin orange
    accent: "#F7931A"
    # Backgrounds (cypherpunk dark)
    base-100: "#08080c"
    base-200: "#0b0b12"
    base-300: "#0e0e16"
    # Text
    base-heading: "#ffffff"
    base-content: "#e4e4ef"
    base-content-muted: "#6e6e8a"
    # Semantic
    positive: "#00FF88"          # cypherpunk green
    negative: "#FF3B30"          # cypherpunk red
    info: "#2962FF"              # cypherpunk blue
    warning: "#FFD700"           # cypherpunk yellow

  colorPalettes:
    # Default chart line palette — Bitcoin orange first, then complementary tones
    default:
      - "#F7931A"
      - "#00e5a0"
      - "#7149C6"
      - "#0079FF"
      - "#FF0060"
      - "#22A699"
