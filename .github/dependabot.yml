version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Evidence 40.1.8 pins these peer packages to exact versions. They must
      # move together with a compatible Evidence release.
      - dependency-name: "@sveltejs/vite-plugin-svelte"
      - dependency-name: "debounce"
      - dependency-name: "git-remote-origin-url"
      - dependency-name: "postcss-load-config"
      - dependency-name: "svelte"
      - dependency-name: "svelte-preprocess"
      - dependency-name: "svelte2tsx"
      - dependency-name: "tailwindcss"
      - dependency-name: "typescript"
      - dependency-name: "unist-util-visit"
      - dependency-name: "vite"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
