name: Publish Bitcoin chart snapshot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-bitcoin-chart
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Refresh TLS certificate trust
        uses: SecretSatoshis/.github/actions/refresh-tls-trust@deb19758624b41175b649a18223ee978bab34bcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python and uv
        uses: SecretSatoshis/.github/actions/setup-python-uv@deb19758624b41175b649a18223ee978bab34bcc
        with:
          python-version: "3.12"
          uv-version: "0.13.4"
      - name: Collect Bitcoin Research Kit data
        run: |
          uv sync --locked
          uv run --no-sync python bitcoin_chart_snapshot.py --output "$RUNNER_TEMP/bitcoin-price.json"
      # A data-only branch keeps the snapshot independent of the daily release and its Pages build.
      - name: Publish the validated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --initial-branch=chart-data "$RUNNER_TEMP/chart-publication"
          cd "$RUNNER_TEMP/chart-publication"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          if git ls-remote --exit-code origin refs/heads/chart-data > /dev/null; then
            git fetch --depth=1 origin refs/heads/chart-data
            git switch -C chart-data FETCH_HEAD
          else
            test "$?" -eq 2
          fi
          cp "$RUNNER_TEMP/bitcoin-price.json" bitcoin-price.json
          git add bitcoin-price.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="GitHub Action" -c user.email="action@github.com" commit -m "Publish Bitcoin chart snapshot"
          git push origin HEAD:refs/heads/chart-data
