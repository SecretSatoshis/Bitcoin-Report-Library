name: Update Bitcoin Reports

on:
  pull_request:
  # Code pushes run the tests only; data is generated and published on the schedule or a
  # manual run. The data bot's own commits do not trigger workflows.
  push:
    branches: [main]
  schedule:
    # 00:30 UTC is 20:30 EDT / 19:30 EST: shortly after Bitcoin's UTC daily close
    # and safely after the New York market close.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-reports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dashboard:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dashboard dependencies
        run: npx --yes npm@12.0.2 ci

      - name: Audit deployed dependency scope
        run: npx --yes npm@12.0.2 audit --omit=dev

      - name: Check dashboard types
        run: npx --yes npm@12.0.2 run typecheck

      - name: Build the static dashboard
        run: |
          npx --yes npm@12.0.2 run sync:local
          npx --yes npm@12.0.2 run build

      - name: Verify data adapters and frozen reference parity
        run: npx --yes npm@12.0.2 test

      - name: Install pinned browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Verify charts, accessibility and responsive layouts
        run: npx --yes npm@12.0.2 run test:browser

      - name: Verify newsletter capture contracts
        run: |
          REPORT_DATE=$(node -p "JSON.parse(require('fs').readFileSync('../csv/release_manifest.json')).report_date")
          npm run export:newsletter -- --report-date "$REPORT_DATE" --output-dir ../outputs/weekly-visuals
          npm run export:newsletter -- --profile quarterly --report-date "$REPORT_DATE" --output-dir ../outputs/quarterly-visuals

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run regression tests
        run: uv run --no-sync python -m unittest discover -s tests -t . -v

      - name: Generate and validate reports
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # Start empty so a retired output cannot linger in the artifact.
          rm -rf csv && mkdir csv
          uv run --no-sync python main.py
          uv run --no-sync python validate_outputs.py
          uv run --no-sync python build_release_page.py
          # The earlier test run checked the previous release; check the new page.
          uv run --no-sync python -m unittest tests.test_release_page -v

      - name: Upload generated reports
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-reports-${{ github.run_id }}
          path: |
            csv/
            README.md
            index.html
            sitemap.xml
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      generated_at: ${{ steps.release.outputs.generated_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Replace the release directory so files this run did not publish are removed.
      - name: Clear the previous release
        run: rm -rf csv

      - name: Download validated reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-reports-${{ github.run_id }}
          path: .

      - name: Commit and push reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A csv/ README.md index.html sitemap.xml
          git diff --cached --quiet || git commit -m "Update Reports"
          gh auth setup-git
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record the release
        id: release
        run: python3 -c "import json; print('generated_at=' + json.load(open('csv/release_manifest.json'))['generated_at'])" >> "$GITHUB_OUTPUT"

  # The Chart Library builds from the release on GitHub Pages, so it is rebuilt only once
  # Pages serves this run's release; an earlier build would chart the previous one.
  charts:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Wait for GitHub Pages to serve the release
        env:
          GENERATED_AT: ${{ needs.publish.outputs.generated_at }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = "https://secretsatoshis.github.io/Bitcoin-Report-Library/csv/release_manifest.json"
          for _ in range(48):
              try:
                  with urllib.request.urlopen(f"{url}?t={time.time_ns()}", timeout=30) as response:
                      if json.load(response).get("generated_at") == os.environ["GENERATED_AT"]:
                          print("Pages serves the new release")
                          break
              except OSError as error:
                  print(f"Retrying after {error}")
              time.sleep(15)
          else:
              raise SystemExit("GitHub Pages did not serve the new release within 12 minutes")
          PY

      - name: Ask Vercel to rebuild the Chart Library
        env:
          DEPLOY_HOOK: ${{ secrets.CHARTS_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "::error::CHARTS_DEPLOY_HOOK_URL secret is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
